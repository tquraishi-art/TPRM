server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Handle client-side routing under /tprm/
    location /tprm/ {
        try_files $uri $uri/ /index.html;
    }

    location = / {
        return 301 /tprm/;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
